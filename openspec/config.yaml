schema: spec-driven

context: |
  Tech stack: Swift, SwiftUI, iOS 17+
  Architecture: local Swift Packages (e.g. SecureCrypto) + app target
  Testing: strict TDD — red → green → refactor for all new behavior
  Task ordering: write failing tests before implementation; no "tests at the end" sections
  Spec scenarios (WHEN/THEN) are the source of truth for test cases
  See openspec/specs/development-practices/spec.md for full policy

rules:
  tasks:
    - Every implementation task MUST be preceded by a "Write failing tests" task in the same section
    - Do NOT group tests in a trailing "Tests" section; interleave test-first with implementation
    - Map OpenSpec WHEN/THEN scenarios to concrete XCTest cases in the test task description

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
